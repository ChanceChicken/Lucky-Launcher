[package]
name = "lucky-launcher"
version = "0.1.0"
edition = "2021"
description = "Lucky Launcher - a performance-focused Minecraft launcher"

[[bin]]
name = "lucky"
path = "src/main.rs"

[[bin]]
name = "lucky-gui"
path = "src/gui.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
eframe = "0.29"
futures = "0.3"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sysinfo = "0.32"
tokio = { version = "1", features = ["full"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
